# Main nginx config of the business layer.
# Key point: a structured JSON access log, the data source for the ML model.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    # JSON access log (one object per line), with fields chosen for operational anomaly detection:
    #   time & identity : time_iso8601, msec, request_id
    #   client          : remote_addr, x_forwarded_for (synthetic client IPs), user agent
    #   request         : method, request_uri (original URI + args), request_length
    #   response        : status, body_bytes_sent, request_time
    #   upstream        : addr/status/connect/response time (strings: may be empty or a list)
    #   connection      : connection id and its request counter (keep-alive behaviour)
    # Numeric fields are unquoted so they parse directly as JSON numbers.
    log_format json_analytics escape=json
        '{'
            '"time_iso8601":"$time_iso8601",'
            '"msec":$msec,'
            '"request_id":"$request_id",'
            '"remote_addr":"$remote_addr",'
            '"x_forwarded_for":"$http_x_forwarded_for",'
            '"request_method":"$request_method",'
            '"request_uri":"$request_uri",'
            '"server_protocol":"$server_protocol",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_length":$request_length,'
            '"request_time":$request_time,'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"upstream_connect_time":"$upstream_connect_time",'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"connection":$connection,'
            '"connection_requests":$connection_requests'
        '}';

    # Buffered writes, flushed every second -> near real-time for the online detector
    access_log  /var/log/nginx/access.json.log  json_analytics  buffer=32k  flush=1s;

    include /etc/nginx/conf.d/*.conf;
}