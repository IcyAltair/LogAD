# Upstream: the FastAPI app. Keep-alive connections reduce proxy overhead.
# NOTE: nginx resolves "app" at startup; if the app container is recreated
# with a new IP, run `docker compose restart nginx`.
upstream api_backend {
    server app:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    # Container health check: excluded from access log to keep ML data clean
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # Static UI. No SPA fallback: missing files must produce real 404s
    # (important for the "not_found_storm" scenario).
    location / {
        try_files $uri $uri/ =404;
    }

    location /static/ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # Business API
    location /api/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID $request_id;

        # Timeouts: injected latency > 10s will surface as 504 (also a valid anomaly)
        proxy_connect_timeout 2s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }

    # Swagger UI / OpenAPI for manual exploration
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass       http://api_backend;
        proxy_set_header Host $host;
    }
}

# Internal status endpoint for nginx-prometheus-exporter (step 2).
# Not published to the host; reachable only from docker networks.
server {
    listen 8081;
    access_log off;

    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
    }
}